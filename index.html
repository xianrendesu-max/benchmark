<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Esports Benchmark Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,#f4f7ff,#eaf0ff);
  color:#222;
  text-align:center;
}
h1{margin-top:20px;}
button{
  padding:14px 28px;
  font-size:16px;
  border:none;
  border-radius:12px;
  background:#4a7dff;
  color:#fff;
  cursor:pointer;
}
#panel{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 15px 30px rgba(0,0,0,.12);
}
.scoreBox{
  display:flex;
  justify-content:space-around;
  margin:15px 0;
}
.score{
  width:30%;
  background:#f2f6ff;
  border-radius:14px;
  padding:12px;
}
.score b{font-size:22px;}
#detail{text-align:left;font-size:14px;}
canvas{margin:20px auto;display:block;border-radius:12px;}
.warn{color:#d40000;font-weight:bold;}
.ok{color:#0a8a00;font-weight:bold;}
</style>
</head>
<body>

<h1>🎮 Esports Benchmark Pro</h1>
<p>世界基準クラス Webベンチマーク</p>
<button id="start">ベンチマーク開始</button>

<div id="panel">
  <div class="scoreBox">
    <div class="score">CPU<br><b id="cpuScore">-</b></div>
    <div class="score">GPU<br><b id="gpuScore">-</b></div>
    <div class="score">TOTAL<br><b id="totalScore">-</b></div>
  </div>

  <canvas id="graph" width="800" height="200"></canvas>
  <div id="detail">待機中</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// =======================
// CPU ベンチ（シングル寄り）
// =======================
function cpuBench(){
  const start=performance.now();
  let x=0;
  for(let i=0;i<3e7;i++){
    x+=Math.sin(i);
  }
  return 200000/(performance.now()-start);
}

// =======================
// GPU ベンチ + フレーム解析
// =======================
async function gpuBench(){
  return new Promise(resolve=>{
    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(400,400);
    document.body.appendChild(renderer.domElement);

    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(60,1,0.1,200);
    camera.position.z=25;
    scene.add(new THREE.AmbientLight(0xffffff));

    const geo=new THREE.BoxGeometry();
    const cubes=[];
    for(let i=0;i<800;i++){
      const c=new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({color:Math.random()*0xffffff})
      );
      c.position.set(
        (Math.random()-0.5)*30,
        (Math.random()-0.5)*30,
        (Math.random()-0.5)*30
      );
      scene.add(c);
      cubes.push(c);
    }

    const frames=[];
    let last=performance.now();
    const start=last;

    function loop(){
      const now=performance.now();
      frames.push(now-last);
      last=now;

      cubes.forEach(c=>{
        c.rotation.x+=0.01;
        c.rotation.y+=0.02;
      });

      renderer.render(scene,camera);

      if(now-start<6000){
        requestAnimationFrame(loop);
      }else{
        document.body.removeChild(renderer.domElement);
        resolve(frames.slice(5)); // 初期揺れ除外
      }
    }
    loop();
  });
}

// =======================
// 統計
// =======================
function percentile(arr,p){
  const s=[...arr].sort((a,b)=>a-b);
  return s[Math.floor(s.length*p)];
}

// =======================
// GPU Tier 推定
// =======================
function gpuTier(avgFPS){
  if(avgFPS>240) return "RTX 4070 / RX 7800 XT 級";
  if(avgFPS>180) return "RTX 3060 / RX 6700 XT 級";
  if(avgFPS>120) return "GTX 1660 / RX 5600 XT 級";
  if(avgFPS>60) return "GTX 1060 / RX 580 級";
  return "エントリーGPU";
}

// =======================
// グラフ描画
// =======================
function drawGraph(frames){
  const ctx=document.getElementById("graph").getContext("2d");
  ctx.clearRect(0,0,800,200);

  ctx.fillStyle="#eaf0ff";
  ctx.fillRect(0,0,800,200);

  ctx.strokeStyle="#4a7dff";
  ctx.beginPath();

  frames.slice(0,800).forEach((v,i)=>{
    const x=i;
    const y=200-(v*4);
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });
  ctx.stroke();
}

// =======================
// 実行
// =======================
document.getElementById("start").onclick=async()=>{
  detail.innerHTML="計測中…";

  const cpu=cpuBench();
  cpuScore.innerText=Math.round(cpu);

  const frames=await gpuBench();
  drawGraph(frames);

  const avgFT=frames.reduce((a,b)=>a+b,0)/frames.length;
  const avgFPS=1000/avgFT;
  const low1=1000/percentile(frames,0.99);
  const low01=1000/percentile(frames,0.999);

  const gpuScore=Math.round(avgFPS*150);
  gpuScoreElem.innerText=gpuScore;

  const total=Math.round(cpu*0.4+gpuScore*0.6);
  totalScore.innerText=total;

  // CPUボトルネック
  const cpuFrame=1000/(cpu/100);
  const bottleneck=cpuFrame>avgFT*1.2;

  detail.innerHTML=`
<b>🎞 フレーム解析</b><br>
平均FPS: ${avgFPS.toFixed(1)}<br>
1% Low: ${low1.toFixed(1)}<br>
0.1% Low: ${low01.toFixed(1)}<br><br>

<b>🧠 CPU</b><br>
スコア: ${Math.round(cpu)}<br>
${bottleneck?'<span class="warn">⚠ CPUボトルネック検出</span>':'<span class="ok">GPU主導</span>'}<br><br>

<b>🎨 GPU 推定</b><br>
${gpuTier(avgFPS)}<br><br>

<b>🎮 実戦評価</b><br>
Valorant: ${avgFPS>240?"240Hz安定":avgFPS>144?"144Hz安定":"要設定調整"}<br>
Fortnite: ${avgFPS>120?"高設定可":avgFPS>60?"中設定":"低設定"}
`;
};
</script>

</body>
</html>
