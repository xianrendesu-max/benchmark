<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Esports Benchmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,#f4f7ff,#eaf0ff);
  color:#222;
  text-align:center;
}
h1{margin-top:20px;}
button{
  padding:14px 26px;
  font-size:16px;
  border:none;
  border-radius:12px;
  background:#4a7dff;
  color:#fff;
  cursor:pointer;
}
#panel{
  max-width:760px;
  margin:20px auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 15px 30px rgba(0,0,0,.12);
}
.scoreBox{
  display:flex;
  justify-content:space-around;
  margin-top:15px;
}
.score{
  background:#f2f6ff;
  padding:15px;
  border-radius:14px;
  width:30%;
}
.score b{font-size:22px;}
#log{text-align:left;margin-top:15px;font-size:14px;}
canvas{display:block;margin:20px auto;border-radius:12px}

/* モーダル */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}
#modalContent{
  background:#fff;
  max-width:600px;
  width:90%;
  border-radius:16px;
  padding:20px;
  text-align:left;
}
.close{
  float:right;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>
<body>

<h1>🎮 Esports Benchmark</h1>
<p>CPU / GPU / ゲーム適正チェック</p>
<button id="start">ベンチマーク開始</button>

<div id="panel">
  <div class="scoreBox">
    <div class="score">CPU<br><b id="cpuScore">-</b></div>
    <div class="score">GPU<br><b id="gpuScore">-</b></div>
    <div class="score">TOTAL<br><b id="totalScore">-</b></div>
  </div>

  <button style="margin-top:15px" onclick="openModal()">詳しく見る</button>
  <div id="log">待機中</div>
</div>

<!-- モーダル -->
<div id="modal">
  <div id="modalContent">
    <span class="close" onclick="closeModal()">✕</span>
    <h2>📊 詳細情報</h2>
    <div id="detail"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const log=t=>document.getElementById("log").innerHTML+= "<br>"+t;

// =======================
// CPU ベンチ
// =======================
function cpuTest(){
  const start=performance.now();
  let x=0;
  for(let i=0;i<2e7;i++){
    x+=Math.sin(i);
  }
  return Math.round(200000/(performance.now()-start));
}

// =======================
// GPU ベンチ（簡略）
let renderer,scene,camera,cubes=[];
async function gpuTest(){
  return new Promise(res=>{
    renderer=new THREE.WebGLRenderer();
    renderer.setSize(360,360);
    document.body.appendChild(renderer.domElement);

    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(60,1,0.1,100);
    camera.position.z=20;
    scene.add(new THREE.AmbientLight(0xffffff));

    const geo=new THREE.BoxGeometry();
    for(let i=0;i<600;i++){
      const c=new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({color:Math.random()*0xffffff})
      );
      c.position.set(
        (Math.random()-0.5)*30,
        (Math.random()-0.5)*30,
        (Math.random()-0.5)*30
      );
      scene.add(c);
      cubes.push(c);
    }

    let frames=0,start=performance.now();
    function loop(){
      cubes.forEach(c=>c.rotation.x+=0.01);
      renderer.render(scene,camera);
      frames++;
      if(performance.now()-start<4000){
        requestAnimationFrame(loop);
      }else{
        res(Math.round(frames*25));
      }
    }
    loop();
  });
}

// =======================
// 実行
// =======================
let cpuS,gpuS;
document.getElementById("start").onclick=async()=>{
  document.getElementById("log").innerHTML="";
  cpuS=cpuTest();
  log("CPU計測完了");

  gpuS=await gpuTest();
  log("GPU計測完了");

  const total=Math.round(cpuS*0.4+gpuS*0.6);

  cpuScore.innerText=cpuS;
  gpuScore.innerText=gpuS;
  totalScore.innerText=total;

  buildDetail(cpuS,gpuS,total);
};

// =======================
// 詳細生成
// =======================
function buildDetail(cpu,gpu,total){
  const cores=navigator.hardwareConcurrency||"?";
  const gl=document.createElement("canvas").getContext("webgl");
  const gpuName=gl.getParameter(gl.RENDERER);

  const valOK=gpu>9000?"◎":gpu>6000?"○":"△";
  const fnOK=gpu>12000?"◎":gpu>8000?"○":"△";

  document.getElementById("detail").innerHTML=`
<b>🧠 CPU</b><br>
スコア: ${cpu}<br>
コア数: ${cores}<br><br>

<b>🎨 GPU</b><br>
${gpuName}<br>
スコア: ${gpu}<br><br>

<b>🎮 ゲーム適正</b><br>
Valorant: ${valOK}（144Hz ${gpu>6000?"可":"不可"}）<br>
Fortnite: ${fnOK}（中設定 ${gpu>8000?"可":"不可"}）<br><br>

<b>⚙ 推奨</b><br>
競技FPS向け: ${total>10000?"◎":"○"}<br>
240Hz適性: ${gpu>12000?"◎":"△"}
`;
}

// =======================
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}
</script>
</body>
  </html>
