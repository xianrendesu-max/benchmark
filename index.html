<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Esports Benchmark Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,#f4f7ff,#eaf0ff);
  color:#222;
  text-align:center;
}
h1{margin-top:20px;}
button{
  padding:12px 26px;
  font-size:16px;
  border:none;
  border-radius:12px;
  background:#4a7dff;
  color:#fff;
  cursor:pointer;
}
#panel{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 15px 30px rgba(0,0,0,.12);
}
.scoreBox{
  display:flex;
  justify-content:space-around;
  margin:15px 0;
}
.score{
  width:22%;
  background:#f2f6ff;
  border-radius:14px;
  padding:12px;
}
.score b{font-size:22px;}

#detailBtn{margin-top:10px;}

#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
}
#modalBox{
  background:#fff;
  width:90%;
  max-width:700px;
  border-radius:18px;
  padding:20px;
  text-align:left;
}
.close{
  float:right;
  cursor:pointer;
  font-weight:bold;
}

canvas{display:block;margin:20px auto;border-radius:12px;}
.warn{color:#d40000;font-weight:bold;}
.ok{color:#0a8a00;font-weight:bold;}
</style>
</head>
<body>

<h1>🎮 Esports Benchmark Pro</h1>
<p>CPU / GPU / 実戦ベンチマーク</p>

<button id="start">ベンチマーク開始</button>

<div id="panel">
  <div class="scoreBox">
    <div class="score">CPU SCORE<br><b id="cpuScore">-</b></div>
    <div class="score">GPU TOTAL<br><b id="gpuTotal">-</b></div>
    <div class="score">FPS AVG<br><b id="fpsAvg">-</b></div>
    <div class="score">TOTAL<br><b id="totalScore">-</b></div>
  </div>

  <button id="detailBtn" onclick="openModal()">詳しく見る</button>

  <canvas id="graph" width="800" height="200"></canvas>
</div>

<!-- 詳細モーダル -->
<div id="modal">
  <div id="modalBox">
    <span class="close" onclick="closeModal()">✕</span>
    <h2>📊 詳細情報</h2>
    <div id="detail"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// =======================
// CPU ベンチ
// =======================
function cpuBench(){
  const start=performance.now();
  let x=0;
  for(let i=0;i<3e7;i++) x+=Math.sin(i);
  return 200000/(performance.now()-start);
}

// =======================
// GPU ベンチ + フレーム取得
// =======================
async function gpuBench(){
  return new Promise(resolve=>{
    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(400,400);
    document.body.appendChild(renderer.domElement);

    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(60,1,0.1,200);
    camera.position.z=25;
    scene.add(new THREE.AmbientLight(0xffffff));

    const geo=new THREE.BoxGeometry();
    const cubes=[];
    for(let i=0;i<800;i++){
      const c=new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({color:Math.random()*0xffffff})
      );
      c.position.set(
        (Math.random()-0.5)*30,
        (Math.random()-0.5)*30,
        (Math.random()-0.5)*30
      );
      scene.add(c);
      cubes.push(c);
    }

    const frames=[];
    let last=performance.now();
    const start=last;

    function loop(){
      const now=performance.now();
      frames.push(now-last);
      last=now;

      cubes.forEach(c=>{
        c.rotation.x+=0.01;
        c.rotation.y+=0.02;
      });

      renderer.render(scene,camera);

      if(now-start<6000){
        requestAnimationFrame(loop);
      }else{
        document.body.removeChild(renderer.domElement);
        resolve(frames.slice(10));
      }
    }
    loop();
  });
}

// =======================
// 統計
// =======================
function percentile(arr,p){
  const s=[...arr].sort((a,b)=>a-b);
  return s[Math.floor(s.length*p)];
}

// =======================
// GPU Tier 推定
// =======================
function gpuTier(fps){
  if(fps>240) return "RTX 4070 / RX 7800 XT 級";
  if(fps>180) return "RTX 3060 / RX 6700 XT 級";
  if(fps>120) return "GTX 1660 / RX 5600 XT 級";
  if(fps>60)  return "GTX 1060 / RX 580 級";
  return "エントリーGPU";
}

// =======================
// GPU 情報
// =======================
function getGPUInfo(){
  const c=document.createElement("canvas");
  const gl=c.getContext("webgl");
  const dbg=gl?.getExtension("WEBGL_debug_renderer_info");
  if(!dbg) return {vendor:"制限",renderer:"制限"};
  return {
    vendor:gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL),
    renderer:gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
  };
}

// =======================
// グラフ描画
// =======================
function drawGraph(frames){
  const ctx=document.getElementById("graph").getContext("2d");
  ctx.clearRect(0,0,800,200);
  ctx.strokeStyle="#4a7dff";
  ctx.beginPath();
  frames.slice(0,800).forEach((v,i)=>{
    const y=200-(v*4);
    if(i===0) ctx.moveTo(i,y);
    else ctx.lineTo(i,y);
  });
  ctx.stroke();
}

// =======================
// 実行
// =======================
let detailHTML="";

document.getElementById("start").onclick=async()=>{
  const cpu=cpuBench();
  cpuScore.innerText=Math.round(cpu);

  const frames=await gpuBench();
  drawGraph(frames);

  const avgFT=frames.reduce((a,b)=>a+b,0)/frames.length;
  const avgFPS=1000/avgFT;
  const low1=1000/percentile(frames,0.99);

  const gpuTotal=Math.round(avgFPS*150);
  gpuTotalElem = document.getElementById("gpuTotal");
  gpuTotalElem.innerText=gpuTotal;

  fpsAvg.innerText=avgFPS.toFixed(1);

  const total=Math.round(cpu*0.4 + gpuTotal*0.6);
  totalScore.innerText=total;

  const gpuInfo=getGPUInfo();
  const cpuFrame=1000/(cpu/100);
  const bottleneck=cpuFrame>avgFT*1.2;

  detailHTML=`
<b>🧠 CPU</b><br>
スコア: ${Math.round(cpu)}<br>
論理コア数: ${navigator.hardwareConcurrency||"?"}<br><br>

<b>🎨 GPU</b><br>
${gpuInfo.renderer}<br>
GPU TOTAL: ${gpuTotal}<br>
推定Tier: ${gpuTier(avgFPS)}<br><br>

<b>🎞 フレーム解析</b><br>
平均FPS: ${avgFPS.toFixed(1)}<br>
1% Low: ${low1.toFixed(1)}<br><br>

<b>⚠ 判定</b><br>
${bottleneck?'<span class="warn">CPUボトルネック検出</span>':'<span class="ok">GPU主導</span>'}<br><br>

<b>🎮 ゲーム適正</b><br>
Valorant: ${avgFPS>240?"240Hz安定":avgFPS>144?"144Hz":"要調整"}<br>
Fortnite: ${avgFPS>120?"高設定":avgFPS>60?"中設定":"低設定"}
`;
};

// =======================
function openModal(){
  detail.innerHTML=detailHTML || "未計測";
  modal.style.display="flex";
}
function closeModal(){
  modal.style.display="none";
}
</script>

</body>
</html>
